# Runs the same checks as CI before every commit: `uv run pre-commit install` once.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src evals scripts
        language: system
        pass_filenames: false
        types: [python]
