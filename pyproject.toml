[project]
name = "eq-analyst"
version = "0.1.0"
description = "Agentic equity research assistant: LangGraph + MCP + Gemini, served over Telegram, observed with Langfuse."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21",
    "cachetools>=5.5",
    "langchain>=1.4",
    "langchain-core>=1.7",
    "langchain-google-genai>=4.4",
    "langchain-mcp-adapters>=0.3",
    "langfuse>=5.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "mcp>=1.30",
    "pandas>=2.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-telegram-bot>=22.0",
    "structlog>=25.0",
    "tenacity>=9.0",
    "yfinance>=1.7",
]

[project.scripts]
eq-mcp-server = "eq_analyst.mcp_server.__main__:main"
eq-bot = "eq_analyst.bot.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "types-cachetools>=5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eq_analyst"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001"]  # allow the ₹ sign and other unicode in strings

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
